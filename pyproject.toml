[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pianorl"
version = "0.1.0"
description = "Reinforcement learning agent that reads music scores and plays a virtual piano"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
